name: Refresh GYS catalog

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install -U "yt-dlp[default,curl-cffi]" pillow

      - name: Fetch latest posts
        run: python watch_gys.py

      - name: Download covers
        run: python fetch_thumbnails.py

      - name: Rebuild site
        run: python generate_site.py

      - name: Commit and push if changed
        run: |
          git add videos.json index.html thumbs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh GYS catalog $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
